<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="刘乐媛 Leyuan Liu — Project Detail">
  <title>Project — 刘乐媛 Leyuan Liu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark">LL</span><span>LEYUAN LIU<span class="brand-sub">PERSONAL ARCHIVE</span></span></a>
      <nav id="nav">
        <a href="index.html#about" data-i18n="navAbout">关于</a>
        <a href="index.html#experience" data-i18n="navExperience">经历</a>
        <a href="index.html#projects" data-i18n="navProjects">项目</a>
        <a href="index.html#credentials" data-i18n="navCredentials">证书与荣誉</a>
        <a href="index.html#skills" data-i18n="navSkills">技能</a>
        <a href="index.html#vault" data-i18n="navVault">数字资产库</a>
      </nav>
      <div class="top-actions">
        <button class="lang-btn" id="langToggle" aria-label="Switch language">EN</button>
        <button class="menu-btn" id="menuToggle" aria-label="Open menu">☰</button>
      </div>
    </header>

    <main id="projectContent"></main>

    <footer>
      <div class="footer-brand">LEYUAN LIU<span>PERSONAL PORTFOLIO & DIGITAL ARCHIVE</span></div>
      <div data-i18n="footerText">持续更新 · 保持好奇 · 用数据解决问题</div>
      <a href="index.html#projects" data-i18n="backToProjects">返回项目列表</a>
    </footer>
  </div>
  
  <script src="data.js"></script>
  <script>
    const D = window.SITE_DATA;
    const I18N = window.I18N;
    let lang = localStorage.getItem("ll_lang") || "zh";
    const tr = k => (I18N[lang] && I18N[lang][k]) || k;
    let currentProject = null;

    function applyStaticI18n(){
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
      document.getElementById("langToggle").textContent = lang === "zh" ? "EN" : "中文";
    }

    function initDetail(){
      const id = new URLSearchParams(location.search).get("id");
      currentProject = D.projects.find(p => p.id === id) || D.projects[0];

      applyStaticI18n();
      renderDetail();

      document.getElementById("langToggle").addEventListener("click", () => {
        lang = lang === "zh" ? "en" : "zh";
        localStorage.setItem("ll_lang", lang);
        applyStaticI18n();
        renderDetail();
      });

      document.getElementById("menuToggle").addEventListener("click", () => document.getElementById("nav").classList.toggle("open"));
    }

    function renderDetail(){
      const p = currentProject, zh = lang === "zh", el = document.getElementById("projectContent");
      if (!p) { el.innerHTML = `<section class="detail-section"><h2>${tr("notFound")}</h2></section>`; return; }
      document.title = (zh ? p.title : p.enTitle) + " — Leyuan Liu";

      // 成果数据
      const outcomes = (p.outcomes || []).length
        ? `<section class="detail-section"><h2>${tr("detailOutcomes")}</h2><div class="outcome-grid">${
            p.outcomes.map(o => `<div class="outcome-card"><strong>${zh ? o[0] : o[1]}</strong><span>${zh ? o[2] : o[3]}</span></div>`).join("")
          }</div></section>` : "";

      // 照片与视频画廊（优先展示视频，再展示图片）
      let mediaHtml = "";
      if (p.video) {
        mediaHtml += `<figure class="gallery-item" style="grid-column: 1 / -1;"><video src="${p.video}" controls preload="metadata" style="height: 400px; object-fit: contain; background: #000;"></video><figcaption>Demo Video</figcaption></figure>`;
      }
      if ((p.gallery || []).length) {
        mediaHtml += p.gallery.map(g => {
          const cap = (zh ? g.zh : g.en) || "";
          return g.type === "video"
            ? `<figure class="gallery-item"><video src="${g.src}" controls preload="metadata"></video><figcaption>${cap}</figcaption></figure>`
            : `<figure class="gallery-item"><img src="${g.src}" alt="${cap}" loading="lazy"><figcaption>${cap}</figcaption></figure>`;
        }).join("");
      }
      
      const gallerySection = mediaHtml 
        ? `<section class="detail-section"><h2>${tr("detailGallery")}</h2><div class="gallery-grid">${mediaHtml}</div></section>`
        : `<section class="detail-section"><h2>${tr("detailGallery")}</h2><p class="empty-state">${tr("galleryEmpty")}</p></section>`;

      // 文档
      const docs = (p.docs || []).length
        ? `<div class="doc-list">${p.docs.map(d =>
            `<a class="doc-link" href="${d.href}" target="_blank" rel="noopener">📄 ${zh ? d.zh : d.en}</a>`).join("")}</div>`
        : `<p class="empty-state">${tr("docsEmpty")}</p>`;

      el.innerHTML = `
        <section class="detail-hero">
          <a class="back-link" href="index.html#projects">← ${tr("backToProjects")}</a>
          <div class="kicker">${p.category.toUpperCase()} · ${p.date}</div>
          <h1>${zh ? p.title : p.enTitle}</h1>
          <p class="detail-sub">${zh ? p.subtitle : p.enSubtitle}</p>
          <p class="detail-intro">${zh ? p.intro : p.enIntro}</p>
          <div class="tech-list">${p.tech.map(t => `<span>${t}</span>`).join("")}</div>
        </section>

        ${outcomes}
        ${gallerySection}
        
        <section class="detail-section"><h2>${tr("detailDocs")}</h2>${docs}</section>
        
        <section class="detail-section"><h2>${tr("detailProcess")}</h2>
          <ul class="detail-body">${p.bullets.map(b => `<li>${b[zh ? 0 : 1]}</li>`).join("")}</ul>
        </section>`;
    }

    initDetail();
  </script>
</body>
</html>
