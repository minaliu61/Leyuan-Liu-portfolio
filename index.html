<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome | 刘乐媛 Leyuan Liu</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .gate-container { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #eef4f7 0%, #fff 100%); }
    .gate-card { background: #fff; padding: 60px 50px; border-radius: 12px; box-shadow: 0 20px 60px rgba(36,78,104,0.08); text-align: center; max-width: 480px; width: 90%; border: 1px solid #e5ebef; animation: fadeInUp 0.8s ease; }
    .gate-card h1 { font-size: 32px; color: #244e68; margin-bottom: 10px; }
    .gate-card p { color: #71808c; margin-bottom: 40px; font-size: 16px; }
    .gate-btns { display: flex; gap: 20px; justify-content: center; }
    .gate-btn { flex: 1; padding: 18px 20px; border: 1px solid #244e68; background: #fff; color: #244e68; font-size: 18px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.3s; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .gate-btn:hover { background: #244e68; color: #fff; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(36,78,104,0.15); }
    .gate-btn.primary { background: #244e68; color: #fff; }
    .gate-btn.primary:hover { background: #1a3b4f; }
    .admin-form { display: none; margin-top: 20px; flex-direction: column; gap: 12px; }
    .admin-form input { padding: 14px; border: 1px solid #dce5ea; border-radius: 6px; font-size: 16px; outline: none; text-align: center; }
    .admin-form input:focus { border-color: #b57b4a; }
    .admin-form .error { color: #b0413e; font-size: 14px; height: 18px; margin: 0; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="gate-container">
    <div class="gate-card">
      <div class="brand-mark" style="margin: 0 auto 20px; width: 50px; height: 50px; font-size: 20px;">LL</div>
      <h1>Leyuan Liu</h1>
      <p>欢迎来到刘乐媛的数字档案</p>
      
      <div class="gate-btns" id="mainBtns">
        <a href="portfolio.html" class="gate-btn primary">
          <span>👔 HR / 访客</span>
          <span style="font-size: 13px; font-weight: 400; opacity: 0.8;">直接查看作品集</span>
        </a>
        <button onclick="showAdminForm()" class="gate-btn">
          <span>👩‍💻 Mina</span>
          <span style="font-size: 13px; font-weight: 400; opacity: 0.8;">进入后台管理</span>
        </button>
      </div>

      <div class="admin-form" id="adminForm">
        <input type="password" id="adminPwd" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter') checkPwd()">
        <button onclick="checkPwd()" class="gate-btn primary" style="padding: 14px; flex-direction: row; justify-content: center;">验证并进入</button>
        <p class="error" id="adminError"></p>
      </div>
    </div>
  </div>
  <script>
    function showAdminForm() {
      document.getElementById('mainBtns').style.display = 'none';
      document.getElementById('adminForm').style.display = 'flex';
      document.getElementById('adminPwd').focus();
    }
    function checkPwd() {
      const pwd = document.getElementById('adminPwd').value;
      if (pwd === 'asd123') {
        sessionStorage.setItem('mina_admin', 'true');
        window.location.href = 'admin.html';
      } else {
        document.getElementById('adminError').textContent = '密码错误，请重试';
        document.getElementById('adminPwd').value = '';
      }
    }
  </script>
</body>
</html>
